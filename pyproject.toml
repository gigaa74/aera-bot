[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aera-vpn"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "aiogram>=3.15,<4",
  "sqlalchemy[asyncio]>=2.0,<2.2", "asyncpg>=0.30,<1", "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2", "redis>=5,<9", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "cryptography>=44", "qrcode[pil]>=8,<9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "fakeredis>=2.39", "PyYAML>=6",
  "coverage>=7.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/bot/texts/portal.py" = ["E501"]
"app/bot/texts/privacy.py" = ["E501"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async engine runs code inside greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
